          PAYLOAD
          base64 --decode /tmp/30fuerte_project.b64 > /tmp/30fuerte_project.zip
          unzip -q /tmp/30fuerte_project.zip -d generated
          echo "=== ARCHIVOS DEL PROYECTO ==="
          find generated -maxdepth 4 -type f | sort
          echo "=== app/build.gradle ==="
          cat generated/app/build.gradle

      - name: Verificar proyecto Android
        run: |
          test -f generated/settings.gradle
          test -f generated/build.gradle
          test -f generated/app/build.gradle
          test -f generated/app/src/main/AndroidManifest.xml
          test -f generated/app/src/main/java/com/fuerte30/app/MainActivity.java
          test -f generated/app/src/main/assets/index.html
          gradle -p generated projects
          gradle -p generated :app:tasks --all | grep assembleDebug

      - name: Compilar APK
        run: gradle --no-daemon -p generated :app:assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          APK="generated/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | head -80

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: 30-FUERTE-APK
          path: generated/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
